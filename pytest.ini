# pytest configuration

[pytest]
# Chemin des tests
testpaths = tests

# Patterns de tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage
addopts = 
    --verbose
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=html
    --cov-report=term-missing

# Markers personnalisés
markers =
    integration: Tests d'intégration
    slow: Tests lents
    security: Tests de sécurité
    unit: Tests unitaires
