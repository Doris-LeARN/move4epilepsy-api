[pytest]
# Configuration pytest pour Move4Epilepsy API

# Répertoires de test
testpaths = tests

# Pattern des fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosité
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers personnalisés
markers =
    unit: Tests unitaires - pas de dépendances externes
    integration: Tests d'intégration - avec BD/API
    security: Tests de sécurité - validation, crypto
    slow: Tests lents (>1s)

# Timeout (secondes)
timeout = 30

# Minimum coverage (si coverage utilisé)
# --cov=app --cov-fail-under=70
