version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: move4epilepsy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: move4epilepsy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - move4epilepsy-network
    restart: unless-stopped

  # Move4Epilepsy API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: move4epilepsy-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Charger depuis .env
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/move4epilepsy
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FORCE_HTTPS: ${FORCE_HTTPS:-False}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-True}
    ports:
      - "8000:8000"
    volumes:
      # Pour développement (hot-reload avec --reload)
      - ./app:/app/app
      - ./logs:/app/logs
    networks:
      - move4epilepsy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PgAdmin (optionnel - gestion DB visuelle)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: move4epilepsy-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - move4epilepsy-network
    restart: unless-stopped
    profiles:
      - dev  # Activer avec: docker-compose --profile dev up

volumes:
  postgres_data:
  pgadmin_data:

networks:
  move4epilepsy-network:
    driver: bridge
